<BODY LINK="#0000ff" VLINK="#800080" BGCOLOR="#ffffff">
<h1 align="center">
<TT>NOOPT, NOOPT-X</TT> </h1>
<p>
Turn off all optimization flags for  atoms of type X.&nbsp; This keyword is useful
for partial geometry optimizations.&nbsp; If &quot;-X'&quot; is missing, turn off all 
optimization flags. If&nbsp; <TT><a href="optx.html">OPT-X</a></TT>&nbsp; is present, 
optimization flags can be turned on after <TT>NOOPT</TT> has been run .</TT></p>
</BODY>
