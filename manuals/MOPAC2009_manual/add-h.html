<h1 align="center">
<TT>ADD-H</TT> </h1>
<p>Adds hydrogen atoms.&nbsp; <TT>ADD-H</TT> is intended for use with proteins.&nbsp; 
Hydrogen atoms are added, in order:</p>
<p>(1) To amino acid residues.<br>
(2) To all other moieties</p>
<p>By implication, <TT><a href="residues.html">RESIDUES</a></TT> is used.. </p>
<p>&nbsp;</p>
