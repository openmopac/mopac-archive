<h1 align="center">
<TT>BCC</TT> </h1>
<TT><P>BCC</TT> is not used by MOPAC at all, but instead is used to inform program BZ about the nature of the solid being studied. </P>
<TT><P>BCC</TT> should be specified if all odd unit cells are omitted. This applies only to layer and solid systems.  </P>
