<h1 align="center">
<TT>OPT-X</TT> </h1>
<p>
Turn on all optimization flags for  atoms of type X.&nbsp; This keyword is useful
for partial geometry optimizations.&nbsp; If &quot;-X'&quot; is missing, turn on all 
optimization flags. If&nbsp; <TT><a href="nooptx.html">NOOPT-X</a></TT>&nbsp; is 
present, optimization flags can be turned off before <TT>OPT</TT> is run .</TT></p>
</BODY>
