<h1 align="center">
<TT>STEP</TT>
</h1>
        In a reaction path, if the path step is constant, <TT>STEP</TT> can  be  used
   instead  of  explicitly  specifying  each  point.  The number of steps is
   given by <TT><a href="point.html">POINT</a></TT>.
