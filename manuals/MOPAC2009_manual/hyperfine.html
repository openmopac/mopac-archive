<h1 align="center">
<TT>HYPERFINE</TT>
</h1>
The quantity:
<p align="center">(1/3)(<i>P<sub>s</sub><font face="Symbol"><sup>a</sup> -
</font>P<sub>s</sub><sup><font face="Symbol">b </font></sup>+2</i><font face="Symbol">(y</font><sub>s</sub><sup><font face="Symbol">a</font></sup><font face="Symbol">)<sup>2</sup>)</font></p>
<p>is printed for all atoms in a radical when <TT>HYPERFINE</TT> is
specified for a UHF system. The
<font face="Symbol">y</font><sub>s</sub><sup><font face="Symbol">a</font></sup>
refers to the highest
occupied alpha-spin molecular orbital.     This quantity is of use in predicting
hyperfine coupling coefficients. </p>
