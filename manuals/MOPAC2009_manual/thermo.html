<h1 align="center" dir="ltr"><A NAME="SECTION0073213000000000000000">
<TT>THERMO(<I>nnn</I>,<I>mmm</I>,<I>lll</I>) </TT> or <TT>THERMO=(<I>nnn</I>,<I>mmm</I>,<I>lll</I>) </TT></A>
</h1>
Same as for <TT><a href="thermo00.html">THERMO(<I>nnn</I>,<I>mmm</I>)</a></TT>, (three integer numbers) only now the
user can explicitly define
the step size.  The step size, <I>lll</I>, cannot be less than 1K.
