<h1 align="center">
<TT>BFGS</TT>
</h1>
The default geometry optimizer, <TT>EF</TT>, is unsuitable for large (over  about
500-1,000 atoms) systems. For large systems, the suggested optimizer is the
Broyden-Fletcher-Goldfarb-Shanno&nbsp;[<A
 HREF="references.html#bfgs1">19</A>,<A
 HREF="references.html#bfgs2">20</A>,<A
 HREF="references.html#bfgs3">21</A>,<A
 HREF="references.html#bfgs4">22</A>] procedure.  By
specifying <TT>BFGS</TT>, this procedure will be used instead of <TT>EF</TT>. </BODY></HTML>
