<h1 align="center">
<TT>DIPOLE</TT>
</h1>
Used in the <a href="esp.html">ESP</a> calculation, <TT>DIPOLE</TT> will  constrain  the  calculated
charges  to  reproduce  the Cartesian dipole moment components calculated from
the density matrix and nuclear charges.
